name: Windows Runner Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Check Windows runner
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Collect Windows environment details
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $cpu = Get-CimInstance -ClassName Win32_Processor | Select-Object -First 1
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem
          $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='$($env:SystemDrive)'"

          $report = [ordered]@{
            ComputerName = $env:COMPUTERNAME
            OperatingSystem = $os.Caption
            OSVersion = $os.Version
            BuildNumber = $os.BuildNumber
            Architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            Processor = $cpu.Name
            LogicalProcessors = $env:NUMBER_OF_PROCESSORS
            TotalMemoryGB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 2)
            SystemDriveFreeGB = [math]::Round($disk.FreeSpace / 1GB, 2)
            PowerShellVersion = $PSVersionTable.PSVersion.ToString()
            CheckedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          }

          $report | ConvertTo-Json -Depth 4 | Out-File -FilePath "$env:GITHUB_WORKSPACE\windows-report.json" -Encoding utf8
          Get-Content "$env:GITHUB_WORKSPACE\windows-report.json"

      - name: Verify essential tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredTools = @('git', 'pwsh')
          foreach ($tool in $requiredTools) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool not found: $tool"
            }
            Write-Host "OK: $tool"
          }

          $optionalTools = @('python', 'node', 'dotnet', 'cmake')
          foreach ($tool in $optionalTools) {
            if (Get-Command $tool -ErrorAction SilentlyContinue) {
              Write-Host "Available: $tool"
            } else {
              Write-Host "Not installed (optional): $tool"
            }
          }

      - name: Upload diagnostics report
        uses: actions/upload-artifact@v4
        with:
          name: windows-runner-report
          path: windows-report.json
          if-no-files-found: error
          retention-days: 7
