name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Download & Setup Ngrok
      run: |
        $webClient = New-Object System.Net.WebClient
        $webClient.DownloadFile('https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip', 'ngrok.zip')
        Expand-Archive ngrok.zip -DestinationPath .\ngrok -Force
    - name: Authenticate Ngrok
      run: |
        .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
    - name: Start RDP Tunnel
      run: |
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        
        $maxAttempts = 20
        $attempt = 0
        $success = $false
        
        while ($attempt -lt $maxAttempts -and -not $success) {
            Start-Sleep -Seconds 3
            $attempt++
            try {
                $ngrokApi = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
                if ($ngrokApi.tunnels) {
                    $success = $true
                }
            } catch {
                Write-Host "Waiting for Ngrok API... attempt $attempt of $maxAttempts"
            }
        }
        
        if (-not $success) {
            Write-Host "Error: Ngrok API failed to start."
            exit 1
        }
        
        $rdpAddress = $ngrokApi.tunnels[0].public_url -replace 'tcp://', ''
        Write-Host "=========================================="
        Write-Host "RDP Address: $rdpAddress"
        Write-Host "Username   : admin"
        Write-Host "Password   : Loc123!"
        Write-Host "=========================================="
        while ($true) { Start-Sleep -Seconds 3600 }
