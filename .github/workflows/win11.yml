name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable Remote Desktop & Configure User
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
        Write-Host "RDP and user configured successfully."
        
    - name: Install Cloudflare Tunnel (cloudflared)
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Installing cloudflared via winget or direct download..."
        
        # Tải trực tiếp binary cloudflared chính thức từ GitHub của Cloudflare
        $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
        Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe"
        Write-Host "cloudflared downloaded successfully."
        
    - name: Start TCP Tunnel via Cloudflare
      run: |
        Write-Host "Starting Cloudflare TCP tunnel for RDP port 3389..."
        
        # Chạy cloudflared tunnel trỏ tới rdp local
        $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "access tcp --url localhost:3389 --hostname rdp.trycloudflare.com" -PassThru -RedirectStandardOutput "cf_out.log" -RedirectStandardError "cf_err.log"
        
        # Lưu ý: cloudflared quick tunnel cho TCP thường sinh ra một địa chỉ ngẫu nhiên hoặc yêu cầu forward port. 
        # Cách chuẩn nhất là dùng lệnh 'tunnel --url rdp://localhost:3389' hoặc dịch vụ thay thế chuyên dụng.
