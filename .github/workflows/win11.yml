name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable Remote Desktop & Configure User
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
        Write-Host "RDP and user configured successfully."
        
    - name: Start TCP Tunnel via Localhost.run (SSH)
      run: |
        # Khởi tạo SSH tunnel qua localhost.run để ánh xạ port 3389 ra ngoài internet công khai
        Write-Host "Starting SSH tunnel to forward RDP port..."
        
        # Chạy ssh background để forward port 3389
        $sshProcess = Start-Process -FilePath "ssh.exe" -ArgumentList "-R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 tunnel.localhost.run" -PassThru -RedirectStandardOutput "ssh_out.log" -RedirectStandardError "ssh_err.log"
        
        # Đợi một chút để tunnel thiết lập và ghi log
        $maxAttempts = 20
        $attempt = 0
        $tunnelUrl = $null
        
        while ($attempt -lt $maxAttempts -and -not $tunnelUrl) {
            Start-Sleep -Seconds 3
            $attempt++
            
            if (Test-Path "ssh_out.log") {
                $content = Get-Content "ssh_out.log" -Raw
                if ($content -match '([a-zA-Z0-9.-]+\.lhr\.life)') {
                    $tunnelUrl = $Matches[1]
                    break
                }
            }
            if (Test-Path "ssh_err.log") {
                $content = Get-Content "ssh_err.log" -Raw
                if ($content -match '([a-zA-Z0-9.-]+\.lhr\.life)') {
                    $tunnelUrl = $Matches[1]
                    break
                }
            }
            Write-Host "Waiting for tunnel endpoint... attempt $attempt of $maxAttempts"
        }
        
        if (-not $tunnelUrl) {
            Write-Host "=== SSH STDOUT ==="
            Get-Content "ssh_out.log" -ErrorAction SilentlyContinue
            Write-Host "=== SSH STDERR ==="
            Get-Content "ssh_err.log" -ErrorAction SilentlyContinue
            exit 1
        }
        
        Write-Host "=========================================="
        Write-Host "RDP Address: $tunnelUrl"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : P@ssword123!"
        Write-Host "=========================================="
        
        # Giữ workflow chạy để duy trì phiên RDP
        while ($true) { Start-Sleep -Seconds 3600 }
