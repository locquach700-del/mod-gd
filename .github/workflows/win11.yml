name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Install Ngrok via Chocolatey
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Installing Ngrok via Chocolatey..."
        choco install ngrok -y
        
        # Làm mới biến môi trường để lệnh ngrok có hiệu lực toàn cục ngay lập tức
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
        
        # Kiểm tra xem ngrok đã khả dụng chưa
        if (!(Get-Command ngrok -ErrorAction SilentlyContinue)) {
            throw "Ngrok installation failed or command not found in PATH."
        }
        Write-Host "Ngrok installed successfully!"
        
    - name: Authenticate Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
        
    - name: Start RDP Tunnel
      run: |
        $process = Start-Process -FilePath "ngrok.exe" -ArgumentList "tcp 3389" -PassThru -RedirectStandardOutput "ngrok_out.log" -RedirectStandardError "ngrok_err.log"
        
        $maxAttempts = 20
        $attempt = 0
        $success = $false
        
        while ($attempt -lt $maxAttempts -and -not $success) {
            Start-Sleep -Seconds 3
            $attempt++
            if ($process.HasExited) {
                Write-Host "[-] Ngrok process exited prematurely with code $($process.ExitCode)"
                break
            }
            try {
                $ngrokApi = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
                if ($ngrokApi.tunnels) {
                    $success = $true
                }
            } catch {
                Write-Host "Waiting for Ngrok API... attempt $attempt of $maxAttempts"
            }
        }
        
        if (-not $success) {
            Write-Host "=== NGROK STDOUT ==="
            Get-Content "ngrok_out.log" -ErrorAction SilentlyContinue
            Write-Host "=== NGROK STDERR ==="
            Get-Content "ngrok_err.log" -ErrorAction SilentlyContinue
            exit 1
        }
        
        $rdpAddress = $ngrokApi.tunnels[0].public_url -replace 'tcp://', ''
        Write-Host "=========================================="
        Write-Host "RDP Address: $rdpAddress"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : P@ssword123!"
        Write-Host "=========================================="
        while ($true) { Start-Sleep -Seconds 3600 }
