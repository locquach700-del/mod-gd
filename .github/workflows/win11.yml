name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Download & Setup Ngrok
      run: |
        $webClient = New-Object System.Net.WebClient
        $webClient.DownloadFile('https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip', 'ngrok.zip')
        Expand-Archive ngrok.zip -DestinationPath .\ngrok -Force
    - name: Authenticate Ngrok
      run: |
        .\ngrok\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "12345" -AsPlainText -Force)
    - name: Start RDP Tunnel
      run: |
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 5
        $ngrokApi = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
        $rdpAddress = $ngrokApi.tunnels[0].public_url -replace 'tcp://', ''
        Write-Host "=========================================="
        Write-Host "RDP Address: $rdpAddress"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : 12345"
        Write-Host "=========================================="
        while ($true) { Start-Sleep -Seconds 3600 }
