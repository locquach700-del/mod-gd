name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Download & Setup Ngrok via Official API
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Fetching latest Ngrok v3 download link from official API..."
        
        # Gọi API chính thức của ngrok để lấy đường dẫn tải trực tiếp mới nhất
        $response = Invoke-RestMethod -Uri "https://bin.equinox.io/os/windows/x86_64/ngrok.zip" -Method Head -MaximumRedirection 0 -ErrorAction SilentlyContinue
        # Hoặc tải trực tiếp thông qua gói dự phòng ổn định qua PowerShell Net.WebClient với User-Agent chuẩn
        
        $wc = New-Object System.Net.WebClient
        $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
        
        # Link tải trực tiếp file zip chính thức từ mirror ổn định của ngrok
        $downloadUrl = "https://bin.equinox.io/c/b3M41H4EP71/ngrok-v3-stable-windows-amd64.zip"
        
        Write-Host "Downloading Ngrok archive..."
        # Tải qua PowerShell trực tiếp kiểm tra kích thước file
        $wc.DownloadFile("https://dl.equinox.io/ngrok/ngrok/stable/windows/amd64/ngrok.zip", "ngrok.zip")
        
        # Kiểm tra nếu file tải về quá nhỏ (tức là file lỗi/HTML), dùng link dự phòng qua GitHub raw
        $fileSize = (Get-Item "ngrok.zip").Length
        if ($fileSize -lt 10000) {
            Write-Host "Primary mirror failed, downloading via trusted backup release..."
            Remove-Item "ngrok.zip" -Force
            # Tải bản ngrok trực tiếp từ file zip lưu trữ dự phòng đáng tin cậy
            $wc.DownloadFile("https://github.com/georgykurushin/ngrok/raw/master/ngrok-stable-windows-amd64.zip", "ngrok.zip")
        }
        
        Expand-Archive -Path "ngrok.zip" -DestinationPath ".\ngrok" -Force
        
        if (!(Test-Path ".\ngrok\ngrok.exe")) {
            $extracted = Get-ChildItem -Path . -Filter "ngrok.exe" -Recurse
            if ($extracted) {
                Move-Item $extracted[0].FullName ".\ngrok\ngrok.exe" -Force
            }
        }
        Write-Host "Ngrok successfully set up!"
    - name: Authenticate Ngrok
      run: |
        .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
    - name: Start RDP Tunnel
      run: |
        $process = Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -PassThru -RedirectStandardOutput "ngrok_out.log" -RedirectStandardError "ngrok_err.log"
        
        $maxAttempts = 20
        $attempt = 0
        $success = $false
        
        while ($attempt -lt $maxAttempts -and -not $success) {
            Start-Sleep -Seconds 3
            $attempt++
            if ($process.HasExited) {
                Write-Host "[-] Ngrok process exited prematurely with code $($process.ExitCode)"
                break
            }
            try {
                $ngrokApi = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
                if ($ngrokApi.tunnels) {
                    $success = $true
                }
            } catch {
                Write-Host "Waiting for Ngrok API... attempt $attempt of $maxAttempts"
            }
        }
        
        if (-not $success) {
            Write-Host "=== NGROK STDOUT ==="
            Get-Content "ngrok_out.log" -ErrorAction SilentlyContinue
            Write-Host "=== NGROK STDERR ==="
            Get-Content "ngrok_err.log" -ErrorAction SilentlyContinue
            exit 1
        }
        
        $rdpAddress = $ngrokApi.tunnels[0].public_url -replace 'tcp://', ''
        Write-Host "=========================================="
        Write-Host "RDP Address: $rdpAddress"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : P@ssword123!"
        Write-Host "=========================================="
        while ($true) { Start-Sleep -Seconds 3600 }
