name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable Remote Desktop & Configure User
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
        Write-Host "RDP and user configured successfully."
        
    - name: Install Cloudflare Tunnel (cloudflared)
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Downloading cloudflared..."
        $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
        Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe"
        Write-Host "cloudflared downloaded successfully."
        
    - name: Start TCP Tunnel via Cloudflare
      run: |
        Write-Host "Starting Cloudflare TCP quick tunnel for RDP port 3389..."
        
        $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -PassThru -RedirectStandardOutput "cf_out.log" -RedirectStandardError "cf_err.log"
        
        $maxAttempts = 25
        $attempt = 0
        $tunnelUrl = $null
        
        while ($attempt -lt $maxAttempts -and -not $tunnelUrl) {
            Start-Sleep -Seconds 3
            $attempt++
            
            if ($process.HasExited) {
                Write-Host "[-] Cloudflare process exited prematurely."
                break
            }
            
            $logContent = ""
            if (Test-Path "cf_out.log") { $logContent += Get-Content "cf_out.log" -Raw }
            if (Test-Path "cf_err.log") { $logContent += Get-Content "cf_err.log" -Raw }
            
            # Quét đúng định dạng URL trycloudflare.com do cloudflared trả về trong log
            if ($logContent -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $Matches[1]
                break
            }
            Write-Host "Waiting for Cloudflare tunnel endpoint... attempt $attempt of $maxAttempts"
        }
        
        if (-not $tunnelUrl) {
            Write-Host "=== CLOUDFLARE STDOUT ==="
            Get-Content "cf_out.log" -ErrorAction SilentlyContinue
            Write-Host "=== CLOUDFLARE STDERR ==="
            Get-Content "cf_err.log" -ErrorAction SilentlyContinue
            exit 1
        }
        
        Write-Host "=========================================="
        Write-Host "RDP Address: $tunnelUrl"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : P@ssword123!"
        Write-Host "=========================================="
        
        while ($true) { Start-Sleep -Seconds 3600 }
