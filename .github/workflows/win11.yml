name: Windows11-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable Remote Desktop & Configure User
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $SecPassword = ConvertTo-SecureString "P@ssword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $SecPassword
        Write-Host "RDP and user configured successfully."
        
    - name: Start TCP Tunnel via Serveo
      run: |
        Write-Host "Starting TCP tunnel via Serveo..."
        
        Remove-Item "ssh_out.log", "ssh_err.log" -ErrorAction SilentlyContinue
        
        $process = Start-Process -FilePath "ssh.exe" -ArgumentList "-R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 serveo.net" -PassThru -RedirectStandardOutput "ssh_out.log" -RedirectStandardError "ssh_err.log"
        
        $maxAttempts = 25
        $attempt = 0
        $tunnelUrl = $null
        
        while ($attempt -lt $maxAttempts -and -not $tunnelUrl) {
            Start-Sleep -Seconds 2
            $attempt++
            
            if ($process.HasExited) {
                Write-Host "[-] SSH process exited prematurely."
                break
            }
            
            # Sử dụng Get-Content với -Raw và -ErrorAction SilentlyContinue để tránh xung đột khóa file
            $logContent = ""
            if (Test-Path "ssh_out.log") {
                $logContent += Get-Content "ssh_out.log" -Raw -ErrorAction SilentlyContinue
            }
            if (Test-Path "ssh_err.log") {
                $logContent += Get-Content "ssh_err.log" -Raw -ErrorAction SilentlyContinue
            }
            
            # Quét tìm địa chỉ định dạng serveousercontent.com hoặc serveo.net kèm cổng TCP
            if ($logContent -match '([a-zA-Z0-9.-]+\.(?:serveo\.net|serveousercontent\.com):[0-9]+)') {
                $tunnelUrl = $Matches[1]
                break
            }
            Write-Host "Waiting for Serveo tunnel endpoint... attempt $attempt of $maxAttempts"
        }
        
        if (-not $tunnelUrl) {
            Write-Host "=== SSH STDOUT ==="
            Get-Content "ssh_out.log" -ErrorAction SilentlyContinue
            Write-Host "=== SSH STDERR ==="
            Get-Content "ssh_err.log" -ErrorAction SilentlyContinue
            exit 1
        }
        
        Write-Host "=========================================="
        Write-Host "RDP Address: $tunnelUrl"
        Write-Host "Username   : runneradmin"
        Write-Host "Password   : P@ssword123!"
        Write-Host "=========================================="
        
        while ($true) { Start-Sleep -Seconds 3600 }
