name: Build Mod-GD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Geode package
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for the mod icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate the Geode mod icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/make_logo.py

      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: Win64
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-gd-windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
